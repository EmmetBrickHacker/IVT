<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osobnosti Informatiky – Gymnáziální Katalog</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card-img-container {
      width: 130px;
      min-width: 130px;
      background-color: #0f172a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .card-content {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .card-highlight {
      font-weight: 600;
      font-style: italic;
      color: #e2e8f0;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .card-medailonek {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal dialog */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--accent);
    }

    .modal-header {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .modal-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }

    .modal-title-area h2 {
      color: var(--accent);
      font-size: 1.6rem;
    }

    .modal-section {
      margin-bottom: 1.2rem;
    }

    .modal-section h3 {
      font-size: 1.05rem;
      color: #e2e8f0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .modal-section p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Osobnosti Informatiky a Výpočetní Vědy</h1>
    <p class="subtitle">Katalog významných osobností pro 1. ročník gymnázia</p>
    <input type="text" id="searchInput" class="search-box" placeholder="Vyhledat podle jména nebo klíčového slova...">
  </header>

  <main class="grid" id="cardsGrid"></main>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="" referrerpolicy="no-referrer">
        <div class="modal-title-area">
          <h2 id="modalName"></h2>
          <p id="modalHighlight" style="font-style: italic; color: #cbd5e1; font-size: 0.95rem; margin-top: 0.3rem;"></p>
        </div>
      </div>
      <div class="modal-section">
        <h3>Medailonek</h3>
        <p id="modalMedailonek"></p>
      </div>
      <div class="modal-section">
        <h3>Vědecké a technické milníky</h3>
        <p id="modalMilniky"></p>
      </div>
      <div class="modal-section">
        <h3>Vědecké milníky a společenský kontext</h3>
        <p id="modalKontext"></p>
      </div>
    </div>
  </div>
